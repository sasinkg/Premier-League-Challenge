name: Deploy to Firebase Hosting

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 0 * * *' # Nightly standings refresh

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Fetch Standings
        run: |
          curl --fail \
            -H "X-Auth-Token: ${{ secrets.VITE_FOOTBALL_API_KEY }}" \
            https://api.football-data.org/v4/competitions/PL/standings \
            -o public/standings.json
          echo "standings.json: $(wc -c < public/standings.json) bytes"

      - name: Fetch Scorers
        run: |
          curl --fail \
            -H "X-Auth-Token: ${{ secrets.VITE_FOOTBALL_API_KEY }}" \
            "https://api.football-data.org/v4/competitions/PL/scorers?limit=50" \
            -o public/scorers.json
          echo "scorers.json: $(wc -c < public/scorers.json) bytes"

      - name: Fetch Teams
        run: |
          curl --fail \
            -H "X-Auth-Token: ${{ secrets.VITE_FOOTBALL_API_KEY }}" \
            https://api.football-data.org/v4/competitions/PL/teams \
            -o public/teams.json
          echo "teams.json: $(wc -c < public/teams.json) bytes"

      - name: Fetch Recent Matches
        run: |
          curl --fail \
            -H "X-Auth-Token: ${{ secrets.VITE_FOOTBALL_API_KEY }}" \
            "https://api.football-data.org/v4/competitions/PL/matches?status=FINISHED" \
            -o public/matches.json
          echo "matches.json: $(wc -c < public/matches.json) bytes"

      - name: Build
        run: npm ci && npm run build
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
          VITE_FOOTBALL_API_KEY: ${{ secrets.VITE_FOOTBALL_API_KEY }}
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ vars.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}

      # Hosting deploys do not publish Firestore rules. Keep the production
      # rules in sync with the app so new Firestore paths are authorised.
      - name: Authenticate for Firebase CLI
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_PREMIER_LEAGUE_CHALLENGE }}

      - name: Deploy Firestore rules
        run: npx firebase-tools deploy --only firestore:rules --project premier-league-challenge

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_PREMIER_LEAGUE_CHALLENGE }}
          channelId: live
          projectId: premier-league-challenge
          entryPoint: .
