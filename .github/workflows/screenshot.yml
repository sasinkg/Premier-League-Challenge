name: Update UI Screenshot

on:
  workflow_run:
    workflows: ["Deploy to Firebase Hosting"]
    types: [completed]
    branches: [main]

permissions:
  contents: write

jobs:
  screenshot:
    name: Capture & Commit Screenshot
    # Only run if the deploy succeeded
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright (Chromium)
        run: npx playwright install --with-deps chromium

      - name: Take screenshot of production site
        run: |
          mkdir -p docs
          SCREENSHOT_URL="https://premier-league-challenge.web.app" \
          SCREENSHOT_PATH="docs/ui.png" \
          npm run screenshot

      - name: Commit screenshot if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/ui.png
          git diff --cached --quiet && echo "No changes." && exit 0
          git commit -m "chore: update UI screenshot [skip ci]"
          git push
