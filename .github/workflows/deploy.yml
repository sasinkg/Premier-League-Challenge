name: Build, Screenshot, Deploy

on:
  pull_request:
  push:
    branches: [main]


jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Build & CI
        run: npm ci && npm run build
        env:
          VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}

      - name: Install Playwright
        run: npx playwright install chromium

      - name: Screenshot UI
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 &
          echo $! > /tmp/preview_pid
          # wait for server
          for i in {1..30}; do
            if curl -sSf http://127.0.0.1:4173/ >/dev/null; then
              echo "Preview is up"
              break
            fi
            sleep 1
          done
          mkdir -p docs
          SCREENSHOT_URL="http://127.0.0.1:4173/" SCREENSHOT_PATH="docs/ui.png" npm run screenshot

      - name: Deploy to Firebase
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_PREMIER_LEAGUE_CHALLENGE }}
          projectId: premier-league-challenge
